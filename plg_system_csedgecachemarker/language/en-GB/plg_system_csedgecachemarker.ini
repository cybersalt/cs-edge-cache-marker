PLG_SYSTEM_CSEDGECACHEMARKER="System - Cybersalt Edge Cache Marker"

PLG_SYSTEM_CSEDGECACHEMARKER_COOKIE_NAME_LABEL="Cookie name"
PLG_SYSTEM_CSEDGECACHEMARKER_COOKIE_NAME_DESC="The name of the marker cookie. Reference this exact name in your edge-cache bypass rule (e.g. Cloudflare rule expression <code>not (http.cookie contains &quot;cs_edit_session=1&quot;)</code>). Default: <code>cs_edit_session</code>."

PLG_SYSTEM_CSEDGECACHEMARKER_COOKIE_VALUE_LABEL="Cookie value"
PLG_SYSTEM_CSEDGECACHEMARKER_COOKIE_VALUE_DESC="The value written into the marker cookie. Default: <code>1</code>. Change only if you need to distinguish multiple types of editor session or coordinate with a more complex bypass expression."

PLG_SYSTEM_CSEDGECACHEMARKER_GROUPS_LABEL="Editor user groups"
PLG_SYSTEM_CSEDGECACHEMARKER_GROUPS_DESC="Only users in one of these groups (or in a group nested under one of them) get the marker cookie when they log in. Defaults to the six standard editing groups: Author, Editor, Publisher, Manager, Administrator, Super Users. Registered-only members do not get the cookie, so pages they read stay cached. If the list is left empty, the six default groups are used."

PLG_SYSTEM_CSEDGECACHEMARKER_COOKIE_LIFETIME_LABEL="Cookie lifetime (seconds)"
PLG_SYSTEM_CSEDGECACHEMARKER_COOKIE_LIFETIME_DESC="Lifetime in seconds. Set to <code>0</code> for a session cookie (cleared when the browser closes) — the recommended default because it matches Joomla's session lifecycle. Setting a positive value (e.g. <code>3600</code>) makes the cookie persist across browser restarts for that many seconds after login."

PLG_SYSTEM_CSEDGECACHEMARKER_COOKIE_SAMESITE_LABEL="SameSite attribute"
PLG_SYSTEM_CSEDGECACHEMARKER_COOKIE_SAMESITE_DESC="Controls whether the cookie is sent on cross-site requests. <code>Lax</code> (default) is right for almost every setup. <code>Strict</code> only if you have specific SSO / cross-origin concerns. <code>None</code> requires HTTPS and will be auto-downgraded to <code>Lax</code> on HTTP requests."

PLG_SYSTEM_CSEDGECACHEMARKER_COOKIE_HTTPONLY_LABEL="HttpOnly flag"
PLG_SYSTEM_CSEDGECACHEMARKER_COOKIE_HTTPONLY_DESC="If enabled, the cookie is not accessible to client-side JavaScript. Recommended <strong>OFF</strong> so any JS on the page (e.g. SP Page Builder editor bootstrap) can also read the marker for its own logic. Turn ON only if you're sure no client code needs to see the cookie."

PLG_SYSTEM_CSEDGECACHEMARKER_DEBUG_MODE_LABEL="Debug logging"
PLG_SYSTEM_CSEDGECACHEMARKER_DEBUG_MODE_DESC="If enabled, writes a line to <code>plg_system_csedgecachemarker.php</code> in Joomla's log folder (Global Configuration &rarr; Logging, normally <code>administrator/logs</code>) each time the plugin sets or clears the cookie, and each time it skips a login because the user is not in a configured group. Each line records the user ID and the visitor's IP address. Turn it off when you are done."
