PLG_SYSTEM_CSEDGECACHEMARKER="System - Cybersalt Edge Cache Marker"
PLG_SYSTEM_CSEDGECACHEMARKER_XML_DESCRIPTION="Sets a marker cookie on editor login so upstream edge caches (Cloudflare, SiteGround, Fastly, Varnish, any CDN) can bypass cached HTML for authenticated editor sessions. Preserves cache-hit ratio for anonymous visitors while letting logged-in editors see live page renders (SP Page Builder front-end edit overlays, Joomla inline pencils, etc.)."
